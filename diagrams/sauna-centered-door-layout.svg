<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img">
  <title>Centered-door sauna layout concept</title>
  <desc>Top-view layout for an eight by eight sauna with centered front door, two front windows, heater on the left front side, L-shaped bench return on the right, back bench, foot platform, and front-right drain scupper.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #111827;
      }
      .title { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #475569; }
      .label { font-size: 17px; font-weight: 650; }
      .note { font-size: 14px; fill: #475569; }
      .small { font-size: 13px; fill: #475569; }
      .room { fill: #f8fafc; stroke: #111827; stroke-width: 6; }
      .wall-shadow { fill: none; stroke: #cbd5e1; stroke-width: 16; }
      .bench { fill: #f3d7b6; stroke: #9a6a36; stroke-width: 2.5; }
      .foot { fill: #f8e6d1; stroke: #b7793d; stroke-width: 2; }
      .heater { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2.5; }
      .glass { fill: #dbeafe; stroke: #2563eb; stroke-width: 3; }
      .door { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 3; }
      .access { fill: #e2e8f0; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 7; }
      .drain { fill: #bfdbfe; stroke: #2563eb; stroke-width: 3; }
      .flow { fill: none; stroke: #2563eb; stroke-width: 4; marker-end: url(#arrow-blue); }
      .dim { fill: none; stroke: #334155; stroke-width: 2.5; marker-start: url(#arrow-slate); marker-end: url(#arrow-slate); }
      .leader { fill: none; stroke: #64748b; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1100" height="760" fill="#ffffff"/>
  <text x="80" y="58" class="title">Centered-door layout concept</text>
  <text x="80" y="84" class="subtitle">Top view, assuming roughly 8 ft x 8 ft finished hot room. Front faces Mt. Tam.</text>

  <rect x="145" y="120" width="810" height="510" rx="4" class="wall-shadow"/>
  <rect x="145" y="120" width="810" height="510" rx="4" class="room"/>

  <text x="470" y="104" class="label">Back wall</text>
  <text x="430" y="676" class="label">Front / Mt. Tam view</text>

  <rect x="190" y="150" width="720" height="88" rx="4" class="bench"/>
  <text x="455" y="199" class="label">Upper bench across back wall</text>
  <text x="820" y="228" class="note">~52 in high</text>

  <rect x="190" y="270" width="720" height="76" rx="4" class="foot"/>
  <text x="438" y="315" class="label">Foot platform / lower bench</text>
  <text x="815" y="338" class="note">~36 in high</text>

  <rect x="190" y="380" width="315" height="58" rx="4" class="access"/>
  <text x="245" y="416" class="label">Access step zone</text>

  <rect x="190" y="470" width="150" height="92" rx="16" class="heater"/>
  <text x="220" y="508" class="label">Heater</text>
  <text x="205" y="533" class="note">under left window</text>

  <rect x="705" y="385" width="160" height="177" rx="4" class="bench"/>
  <text x="724" y="435" class="label">
    <tspan x="724" dy="0">Bench return</tspan>
    <tspan x="724" dy="27" class="note">add foot rail or</tspan>
    <tspan x="724" dy="21" class="note">short foot deck</tspan>
  </text>

  <rect x="205" y="612" width="210" height="36" rx="4" class="glass"/>
  <text x="260" y="658" class="small">left window</text>

  <rect x="500" y="598" width="100" height="62" rx="4" class="door"/>
  <path d="M 500 598 Q 555 548 600 598" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="510" y="688" class="small">centered door</text>

  <rect x="685" y="612" width="210" height="36" rx="4" class="glass"/>
  <text x="740" y="658" class="small">right window</text>

  <rect x="880" y="600" width="34" height="44" rx="5" class="drain"/>
  <text x="895" y="586" class="note" text-anchor="middle">low point</text>
  <text x="930" y="620" class="note">drain scupper</text>
  <path d="M 845 560 C 880 585, 895 595, 897 620" class="flow"/>
  <path d="M 912 625 C 960 650, 995 674, 1030 705" class="flow"/>
  <text x="825" y="548" class="note">slab slopes this way</text>
  <text x="958" y="700" class="note">water exits outside</text>

  <line x1="145" y1="705" x2="955" y2="705" class="dim"/>
  <text x="528" y="733" class="label">~8 ft</text>
  <line x1="1000" y1="120" x2="1000" y2="630" class="dim"/>
  <text x="1016" y="384" class="label">~8 ft</text>

  <path d="M 340 470 L 410 438" class="leader"/>
  <text x="415" y="438" class="note">Keep heater guard clear of entry path.</text>

  <path d="M 705 555 L 645 595" class="leader"/>
  <text x="480" y="583" class="note">L return works only if feet are supported.</text>
</svg>
