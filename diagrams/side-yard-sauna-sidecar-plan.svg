<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Side-yard sauna with storage sidecar</title>
  <desc id="desc">Top-view concept for a compact side-yard sauna on a ten foot by eight foot pad. A roughly seven foot hot room sits next to a narrow exterior storage sidecar under the same roof. The storage has its own exterior door and does not open into the sauna.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .title { font-size: 28px; font-weight: 700; }
      .sub { font-size: 16px; fill: #475569; }
      .label { font-size: 17px; font-weight: 650; }
      .note { font-size: 14px; fill: #475569; }
      .small { font-size: 13px; fill: #475569; }
      .pad { fill: #f4f1e8; stroke: #8b7b58; stroke-width: 3; }
      .retainer { fill: none; stroke: #525252; stroke-width: 8; stroke-linecap: round; }
      .shell { fill: #f8fafc; stroke: #111827; stroke-width: 7; }
      .hotroom { fill: #fff7ed; stroke: #7c2d12; stroke-width: 3; }
      .closet { fill: #eef2ff; stroke: #4338ca; stroke-width: 3; }
      .divider { stroke: #111827; stroke-width: 6; }
      .bench { fill: #f1c99a; stroke: #9a6a36; stroke-width: 2.5; }
      .foot { fill: #f8e4c8; stroke: #b7793d; stroke-width: 2; }
      .heater { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2.5; }
      .door { fill: #dbeafe; stroke: #2563eb; stroke-width: 3; }
      .closetdoor { fill: #e0e7ff; stroke: #4338ca; stroke-width: 3; }
      .shelf { fill: #dbeafe; stroke: #334155; stroke-width: 2; }
      .pier { fill: #e5e7eb; stroke: #374151; stroke-width: 2; }
      .dim { fill: none; stroke: #334155; stroke-width: 2.5; marker-start: url(#arrow); marker-end: url(#arrow); }
      .clear { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="70" y="54" class="title">Sidecar plan: compact sauna plus useful storage</text>
  <text x="70" y="82" class="sub">The sidecar shares the roof and exterior skin, but stays outside the hot-room air and moisture envelope.</text>

  <rect x="100" y="145" width="760" height="608" rx="8" class="pad"/>
  <path d="M 100 145 H 860 V 753 H 100 Z" class="retainer"/>
  <text x="370" y="130" class="label">10 ft x 8 ft DG pad</text>
  <text x="390" y="790" class="label">front / approach</text>
  <text x="385" y="170" class="small">fence behind</text>

  <rect x="170" y="210" width="635" height="520" rx="6" class="shell"/>
  <rect x="200" y="240" width="440" height="460" rx="3" class="hotroom"/>
  <rect x="640" y="240" width="135" height="460" rx="3" class="closet"/>
  <line x1="640" y1="240" x2="640" y2="700" class="divider"/>

  <text x="312" y="231" class="label">hot room</text>
  <text x="661" y="231" class="label">sidecar</text>
  <text x="265" y="715" class="small">about 6 ft 8 in to 7 ft exterior hot room width</text>
  <text x="645" y="716" class="small">about 24-28 in interior storage</text>

  <circle cx="207" cy="247" r="14" class="pier"/>
  <circle cx="414" cy="247" r="14" class="pier"/>
  <circle cx="767" cy="247" r="14" class="pier"/>
  <circle cx="207" cy="478" r="14" class="pier"/>
  <circle cx="414" cy="478" r="14" class="pier"/>
  <circle cx="767" cy="478" r="14" class="pier"/>
  <circle cx="207" cy="693" r="14" class="pier"/>
  <circle cx="414" cy="693" r="14" class="pier"/>
  <circle cx="767" cy="693" r="14" class="pier"/>

  <rect x="225" y="260" width="385" height="108" rx="5" class="bench"/>
  <text x="300" y="320" class="label">main upper bench</text>
  <text x="310" y="345" class="note">two comfortable, three seated</text>

  <rect x="225" y="398" width="385" height="82" rx="5" class="foot"/>
  <text x="300" y="448" class="label">continuous foot platform</text>

  <rect x="510" y="502" width="100" height="122" rx="5" class="bench"/>
  <text x="532" y="555" class="label">short</text>
  <text x="526" y="578" class="label">return</text>
  <text x="521" y="603" class="note">fourth seat</text>

  <rect x="238" y="580" width="108" height="102" rx="18" class="heater"/>
  <text x="258" y="628" class="label">HUUM</text>
  <text x="240" y="703" class="small">heater near electrical side if this matches panel</text>

  <rect x="405" y="700" width="118" height="52" rx="5" class="door"/>
  <path d="M 405 700 Q 465 635 523 700" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <text x="395" y="682" class="label">glass sauna door</text>

  <rect x="665" y="700" width="78" height="52" rx="5" class="closetdoor"/>
  <path d="M 665 700 Q 704 655 743 700" fill="none" stroke="#4338ca" stroke-width="2.5"/>
  <text x="648" y="682" class="label">closet door</text>

  <rect x="665" y="270" width="78" height="38" rx="3" class="shelf"/>
  <rect x="665" y="335" width="78" height="38" rx="3" class="shelf"/>
  <rect x="665" y="400" width="78" height="38" rx="3" class="shelf"/>
  <rect x="665" y="465" width="78" height="130" rx="3" class="clear"/>
  <text x="672" y="523" class="note">tall slot</text>
  <text x="657" y="620" class="note">towels, wood, chemicals, tools</text>

  <rect x="890" y="245" width="230" height="242" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="918" y="285" class="label">Design rule</text>
  <text x="918" y="318" class="note">1. No door between closet</text>
  <text x="938" y="338" class="note">and hot room.</text>
  <text x="918" y="372" class="note">2. Separate floor/drainage.</text>
  <text x="918" y="406" class="note">3. Shared roof is fine.</text>
  <text x="918" y="440" class="note">4. Keep heater clearances</text>
  <text x="938" y="460" class="note">inside the hot room.</text>

  <line x1="100" y1="108" x2="860" y2="108" class="dim"/>
  <text x="455" y="101" class="small">10 ft</text>
  <line x1="885" y1="145" x2="885" y2="753" class="dim"/>
  <text x="900" y="455" class="small">8 ft</text>
</svg>
