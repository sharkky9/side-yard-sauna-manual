        <line x1="0" y1="5" x2="34" y2="5" stroke="#9a6b31" stroke-width="1"/>
      </pattern>
      <pattern id="siding" width="38" height="38" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="38" stroke="#c8ced6" stroke-width="1"/>
      </pattern>
      <style>
