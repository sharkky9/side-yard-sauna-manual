      <rect x="855" y="376" width="12" height="86" class="" fill="#245f9f" stroke="#245f9f"/>
      <rect x="293" y="672" width="12" height="86" class="" fill="#245f9f" stroke="#245f9f"/>
      <rect x="293" y="264" width="12" height="72" class="" fill="#245f9f" stroke="#245f9f"/>
      <circle cx="408" cy="250" r="20" class="object-light" fill="#fffdf8" stroke="#111827" stroke-width="2"/>
      <text x="408" y="256" class="small" text-anchor="middle" >T</text>
