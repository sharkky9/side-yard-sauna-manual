<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Heater, Vent, And Control Rough-In</title>
  <desc id="desc">Plan detail of heater clearance zone, door swing, ventilation rough-in, door sensor, temperature sensor, and electrical control boundary.</desc>
  
    <defs>
