      <path d="M348 720 C520 744, 660 724, 686 636" class="blue-dash" marker-end="url(#arrow-blue)"/>
      
    <circle cx="838" cy="574" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="838" y="579" class="key" text-anchor="middle" >1</text>
      
    <circle cx="888" cy="420" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="888" y="425" class="key" text-anchor="middle" >2</text>
      
    <circle cx="272" cy="720" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="272" y="725" class="key" text-anchor="middle" >3</text>
      
    <circle cx="272" cy="302" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="272" y="307" class="key" text-anchor="middle" >4</text>
      
    <circle cx="408" cy="250" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="408" y="255" class="key" text-anchor="middle" >5</text>
      
    <circle cx="728" cy="824" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="728" y="829" class="key" text-anchor="middle" >6</text>
      
    <line x1="460" y1="898" x2="460" y2="940" class="ext"/>
    <line x1="700" y1="898" x2="700" y2="940" class="ext"/>
    <line x1="460" y1="922" x2="700" y2="922" class="dim"/>
    <line x1="452" y1="930" x2="468" y2="914" class="dim"/>
    <line x1="692" y1="930" x2="708" y2="914" class="dim"/>
    <text x="580" y="945" class="dimtxt" text-anchor="middle" >30 in door</text>
      
    <line x1="408" y1="106" x2="408" y2="148" class="ext"/>
    <line x1="732" y1="106" x2="732" y2="148" class="ext"/>
    <line x1="408" y1="130" x2="732" y2="130" class="dim"/>
    <line x1="400" y1="138" x2="416" y2="122" class="dim"/>
    <line x1="724" y1="138" x2="740" y2="122" class="dim"/>
    <text x="570" y="121" class="dimtxt" text-anchor="middle" >sensor kept away from heater zone</text>
      <text x="580" y="906" class="label" text-anchor="middle" >Front / door side</text>
      
    <g transform="translate(975 228)">
      <text x="0" y="0" class="label" text-anchor="start" >Rough-in keynotes</text>
      
      
    <circle cx="13" cy="31" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="13" y="36" class="key" text-anchor="middle" >1</text>
      <text x="38" y="36" class="note" text-anchor="start" >Heater clearance envelope stays open until</text><text x="38" y="55" class="note" text-anchor="start" >current manual is checked.</text>
      
    <circle cx="13" cy="95" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="13" y="100" class="key" text-anchor="middle" >2</text>
      <text x="38" y="100" class="note" text-anchor="start" >Supply near heater, sleeved, screened, and</text><text x="38" y="119" class="note" text-anchor="start" >flashed.</text>
      
    <circle cx="13" cy="159" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="13" y="164" class="key" text-anchor="middle" >3</text>
      <text x="38" y="164" class="note" text-anchor="start" >Low exhaust on opposite side for active</text><text x="38" y="183" class="note" text-anchor="start" >ventilation.</text>
      
    <circle cx="13" cy="223" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="13" y="228" class="key" text-anchor="middle" >4</text>
      <text x="38" y="228" class="note" text-anchor="start" >High drying vent for post-bath drying</text><text x="38" y="247" class="note" text-anchor="start" >cycle.</text>
      
    <circle cx="13" cy="287" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="13" y="292" class="key" text-anchor="middle" >5</text>
      <text x="38" y="292" class="note" text-anchor="start" >Temperature sensor: follow HUUM/UKU height</text><text x="38" y="311" class="note" text-anchor="start" >and offset rules.</text>
      
    <circle cx="13" cy="351" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="13" y="356" class="key" text-anchor="middle" >6</text>
      <text x="38" y="356" class="note" text-anchor="start" >Door sensor on handle side; route before</text><text x="38" y="375" class="note" text-anchor="start" >cladding.</text>
    </g>
      <g transform="translate(975 610)"><rect x="0" y="0" width="410" height="176" class="object-light" fill="#fffdf8"/><text x="14" y="27" class="small" text-anchor="start" >Electrical boundary</text><line x1="0" y1="40" x2="410" y2="40" class="thin"/><line x1="0" y1="74" x2="410" y2="74" class="thin"/><text x="14" y="63" class="tiny" text-anchor="start" >Owned by</text><text x="164" y="63" class="tiny" text-anchor="start" >electrician and AHJ</text><line x1="0" y1="108" x2="410" y2="108" class="thin"/><text x="14" y="97" class="tiny" text-anchor="start" >Resolve</text><text x="164" y="97" class="tiny" text-anchor="start" >breaker/GFCI/disconnect</text><line x1="0" y1="142" x2="410" y2="142" class="thin"/><text x="14" y="131" class="tiny" text-anchor="start" >Photo before close</text><text x="164" y="131" class="tiny" text-anchor="start" >conduit, sensors, bonding</text><line x1="0" y1="176" x2="410" y2="176" class="thin"/><text x="14" y="165" class="tiny" text-anchor="start" >Final test</text><text x="164" y="165" class="tiny" text-anchor="start" >manufacturer startup sequence</text><line x1="150" y1="40" x2="150" y2="176" class="thin"/></g>
</svg>