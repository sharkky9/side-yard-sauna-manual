<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Revised Floor Plan</title>
  <desc id="desc">Architectural floor plan of the revised sidecar sauna showing dimensions, walls, benches, heater zone, doors, DG pad, and storage bay.</desc>
  
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 Z" fill="#121820" />
      </marker>
      <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 Z" fill="#245f9f" />
      </marker>
      <pattern id="soil-hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="18" stroke="#c8c1b2" stroke-width="1"/>
      </pattern>
      <pattern id="deck-hatch" width="16" height="16" patternUnits="userSpaceOnUse">
        <path d="M0 16 L16 0" stroke="#d1c39f" stroke-width="1"/>
      </pattern>
      <pattern id="wood-grain" width="28" height="8" patternUnits="userSpaceOnUse">
        <line x1="0" y1="4" x2="28" y2="4" stroke="#b78953" stroke-width="1"/>
      </pattern>
      <style>
        .sheet-bg{fill:#fffdf8}
        .border{fill:none;stroke:#121820;stroke-width:2}
        .title-line{stroke:#121820;stroke-width:1.2}
        .wall{fill:#d8dce2;stroke:#121820;stroke-width:4}
        .cut{fill:#fffdf8;stroke:#121820;stroke-width:3}
        .thin{fill:none;stroke:#121820;stroke-width:1.4}
        .med{fill:none;stroke:#121820;stroke-width:2.2}
        .heavy{fill:none;stroke:#121820;stroke-width:4}
        .dim{fill:none;stroke:#121820;stroke-width:1.2;marker-start:url(#arrow);marker-end:url(#arrow)}
        .ext{stroke:#5c6673;stroke-width:1;stroke-dasharray:5 5}
        .label{font:500 22px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;fill:#121820}
        .small{font:500 16px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;fill:#121820}
        .tiny{font:500 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;fill:#121820}
        .dimtxt{font:700 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;fill:#121820}
        .note{font:500 15px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;fill:#5c6673}
        .title{font:800 28px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;fill:#121820}
        .sheetno{font:900 38px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;fill:#121820}
        .badge{font:800 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;fill:#fff}
      </style>
    </defs>
  <rect width="1600" height="1100" class="sheet-bg"/>
  
    <rect x="40" y="40" width="1520" height="1020" class="border"/>
    <line x1="40" y1="980" x2="1560" y2="980" class="title-line"/>
    <line x1="1160" y1="980" x2="1160" y2="1060" class="title-line"/>
    <text x="64" y="1024" class="title">Revised Floor Plan</text>
    <text x="64" y="1052" class="note">Hot room 70 x 84 clear · sidecar storage 60 x 84 clear · exterior wall footprint 148 x 96</text>
    <text x="1190" y="1030" class="sheetno">A101</text>
    <text x="1190" y="1056" class="note">Side Yard Sauna · revised sidecar scheme · dimensions in inches</text>
  
      <rect x="92" y="190" width="180" height="576" class="" fill="url(#soil-hatch)" stroke="#c8c1b2" stroke-width="1"/>
      <rect x="274" y="204" width="900" height="588" class="" fill="url(#deck-hatch)" stroke="#4b5563" stroke-width="2" stroke-dasharray="8 6"/>
      <rect x="364" y="210" width="720" height="576" class="" fill="#efe5cf" stroke="#8c7b59" stroke-width="2" stroke-dasharray="9 7"/>
      <text x="724" y="242" class="small" text-anchor="middle" >existing compacted DG pad · 120 x 96</text>
      <rect x="280" y="210" width="888" height="576" class="wall" />
      <rect x="316" y="246" width="420" height="504" class="cut" fill="#fff7e6"/>
      <rect x="736" y="246" width="36" height="504" class="wall" />
      <rect x="772" y="246" width="360" height="504" class="cut" fill="#eef7f1"/>
      <rect x="436" y="749" width="180" height="40" class="" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/>
      <path d="M436 786 A180 180 0 0 0 616 966" class="thin"/>
      <line x1="436" y1="786" x2="616" y2="786" class="med"/>
      <text x="526" y="828" class="tiny" text-anchor="middle" >30 in out-swing sauna door</text>
      <rect x="862" y="749" width="180" height="40" class="" fill="#fffdf8" stroke="#fffdf8" stroke-width="2"/>
      <path d="M862 786 A180 180 0 0 0 1042 966" class="thin"/>
      <line x1="862" y1="786" x2="1042" y2="786" class="med"/>
      <text x="952" y="828" class="tiny" text-anchor="middle" >storage door</text>
      <rect x="316" y="246" width="420" height="144" class="" fill="url(#wood-grain)" stroke="#121820" stroke-width="1.6"/>
      <rect x="316" y="246" width="144" height="312" class="" fill="url(#wood-grain)" stroke="#121820" stroke-width="1.6"/>
      <rect x="316" y="390" width="300" height="108" class="" fill="#f4ddba" stroke="#121820" stroke-width="1.2"/>
      <rect x="460" y="390" width="288" height="108" class="" fill="#f4ddba" stroke="#121820" stroke-width="1.2"/>
      <rect x="478" y="594" width="132" height="66" class="" fill="#f4ddba" stroke="#121820" stroke-width="1.2"/>
      <text x="526" y="360" class="tiny" text-anchor="middle" >upper bench</text>
      <text x="376" y="546" class="tiny" text-anchor="middle" transform="rotate(-90 376 546)">return</text>
      <rect x="562" y="552" width="168" height="168" class="" fill="none" stroke="#a33a2a" stroke-width="2.4" stroke-dasharray="10 6"/>
      <circle cx="646" cy="636" r="54.375" fill="#2b2f36" stroke="#121820" stroke-width="2"/>
      <circle cx="646" cy="636" r="32.400000000000006" fill="#6d747d" stroke="#fff" stroke-width="1"/>
      <text x="646" y="640" class="tiny" text-anchor="middle" fill="#fff">18 in</text>
      <text x="646" y="780" class="tiny" text-anchor="middle" >28 x 28 heater planning zone</text>
      <rect x="808" y="282" width="288" height="72" class="" fill="#d8ebdd" stroke="#121820" stroke-width="1.2"/>
      <rect x="1048" y="378" width="48" height="300" class="" fill="#d8ebdd" stroke="#121820" stroke-width="1.2"/>
      <text x="952" y="498" class="small" text-anchor="middle" >sidecar storage · 60 x 84 clear</text>
      <text x="526" y="518" class="small" text-anchor="middle" >hot room · 70 x 84 clear</text>
      
    <line x1="280" y1="130" x2="280" y2="160" class="ext"/>
    <line x1="1168" y1="130" x2="1168" y2="160" class="ext"/>
    <line x1="280" y1="152" x2="1168" y2="152" class="dim"/>
    <text x="724" y="144" class="dimtxt" text-anchor="middle" >148 exterior wall footprint</text>
      
    <line x1="316" y1="166" x2="316" y2="196" class="ext"/>
    <line x1="736" y1="166" x2="736" y2="196" class="ext"/>
    <line x1="316" y1="188" x2="736" y2="188" class="dim"/>
    <text x="526" y="180" class="dimtxt" text-anchor="middle" >70 hot room</text>
      
    <line x1="772" y1="166" x2="772" y2="196" class="ext"/>
    <line x1="1132" y1="166" x2="1132" y2="196" class="ext"/>
    <line x1="772" y1="188" x2="1132" y2="188" class="dim"/>
    <text x="952" y="180" class="dimtxt" text-anchor="middle" >60 sidecar</text>
      
    <line x1="364" y1="856" x2="364" y2="886" class="ext"/>
    <line x1="1084" y1="856" x2="1084" y2="886" class="ext"/>
    <line x1="364" y1="878" x2="1084" y2="878" class="dim"/>
    <text x="724" y="870" class="dimtxt" text-anchor="middle" >120 existing DG pad</text>
      
    <line x1="220" y1="210" x2="252" y2="210" class="ext"/>
    <line x1="220" y1="786" x2="252" y2="786" class="ext"/>
    <line x1="228" y1="210" x2="228" y2="786" class="dim"/>
    <text x="220" y="498" class="dimtxt" text-anchor="middle" transform="rotate(-90 220 498)">96 exterior depth</text>
      
    <line x1="252" y1="246" x2="284" y2="246" class="ext"/>
    <line x1="252" y1="750" x2="284" y2="750" class="ext"/>
    <line x1="260" y1="246" x2="260" y2="750" class="dim"/>
    <text x="252" y="498" class="dimtxt" text-anchor="middle" transform="rotate(-90 252 498)">84 clear interior depth</text>
      
    <path d="M1202 242 L1254 190" class="thin"/>
    <circle cx="1202" cy="242" r="4" fill="#121820"/>
    <text x="1262" y="195" class="tiny" text-anchor="start" >roof/eaves must be designed separately</text>
      
    <path d="M1202 746 L1254 792" class="thin"/>
    <circle cx="1202" cy="746" r="4" fill="#121820"/>
    <text x="1262" y="797" class="tiny" text-anchor="start" >side extension lands on soil piers</text>
      <text x="142" y="216" class="small" text-anchor="start" >soil beyond DG</text>
      <text x="724" y="918" class="label" text-anchor="middle" >Front / approach side</text>
      <line x1="634" y1="932" x2="814" y2="932" class="med"/>
      <path d="M814 932 l-18 -8 l0 16 z" fill="#121820"/>
      <g transform="translate(1240 208)">
        <text x="0" y="0" class="label" text-anchor="start" >Plan notes</text>
        <text x="0" y="38" class="note" text-anchor="start" >1. Sidecar is now a real 5 ft clear storage bay.</text>
        <text x="0" y="70" class="note" text-anchor="start" >2. Wall footprint exceeds the 10 ft DG pad by 28 in.</text>
        <text x="0" y="102" class="note" text-anchor="start" >3. Hold hot-room width at 70 in; depth grows to 84 in.</text>
        <text x="0" y="134" class="note" text-anchor="start" >4. Heater remains on the right side of the hot room.</text>
        <text x="0" y="166" class="note" text-anchor="start" >5. Door and heater trim still get field verification.</text>
      </g>
</svg>