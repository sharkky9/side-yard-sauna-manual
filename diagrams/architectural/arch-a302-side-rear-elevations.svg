    <g transform="translate(250 780)">
      <text x="0" y="0" class="label" text-anchor="start" >Elevation keynotes</text>
      
      
    <circle cx="13" cy="31" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="13" y="36" class="key" text-anchor="middle" >1</text>
      <text x="38" y="36" class="note" text-anchor="start" >Keep vent sleeves screened and</text><text x="38" y="55" class="note" text-anchor="start" >serviceable.</text>
      
    <circle cx="13" cy="95" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="13" y="100" class="key" text-anchor="middle" >2</text>
      <text x="38" y="100" class="note" text-anchor="start" >Overhang/drip edge cannot dump water into</text><text x="38" y="119" class="note" text-anchor="start" >fence or panel zone.</text>
      
    <circle cx="13" cy="159" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="13" y="164" class="key" text-anchor="middle" >3</text>
      <text x="38" y="164" class="note" text-anchor="start" >Rear wall can stay visually quiet; no view</text><text x="38" y="183" class="note" text-anchor="start" >to frame.</text>
      
    <circle cx="13" cy="223" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="13" y="228" class="key" text-anchor="middle" >4</text>
      <text x="38" y="228" class="note" text-anchor="start" >Low exhaust/sidecar venting should not</text><text x="38" y="247" class="note" text-anchor="start" >blow into a dead damp corner.</text>
