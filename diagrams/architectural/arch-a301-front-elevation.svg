<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">A301 Front Elevation</title>
  <desc id="desc">Front elevation showing integrated sauna and sidecar facade, doors, roof plane, siding rhythm, DG pad, and exterior weathering notes.</desc>
  
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 Z" fill="#111827"/>
      </marker>
      <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 Z" fill="#245f9f"/>
      </marker>
      <pattern id="soil-hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="16" stroke="#c9c1b4" stroke-width="1"/>
      </pattern>
      <pattern id="dg-hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="18" stroke="#b9a47d" stroke-width="1.2"/>
      </pattern>
      <pattern id="wood-hatch" width="34" height="10" patternUnits="userSpaceOnUse">
        <line x1="0" y1="5" x2="34" y2="5" stroke="#9a6b31" stroke-width="1"/>
      </pattern>
      <pattern id="siding" width="38" height="38" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="38" stroke="#c8ced6" stroke-width="1"/>
      </pattern>
      <style>
        .bg{fill:#fffdf8}
        .sheet-border{fill:none;stroke:#111827;stroke-width:2}
        .title-rule{stroke:#111827;stroke-width:1.2}
        .cut{fill:#d9dde3;stroke:#111827;stroke-width:5;stroke-linejoin:round}
        .object{fill:#fffdf8;stroke:#111827;stroke-width:2.4;stroke-linejoin:round}
        .object-light{fill:#fffdf8;stroke:#111827;stroke-width:1.4;stroke-linejoin:round}
        .hidden{fill:none;stroke:#5b6470;stroke-width:1.4;stroke-dasharray:8 6}
        .planning{fill:none;stroke:#a23d30;stroke-width:2.2;stroke-dasharray:10 7}
        .blue-line{fill:none;stroke:#245f9f;stroke-width:2.4}
        .blue-dash{fill:none;stroke:#245f9f;stroke-width:2;stroke-dasharray:9 6}
        .dim{fill:none;stroke:#111827;stroke-width:1.2}
        .ext{stroke:#5b6470;stroke-width:1;stroke-dasharray:5 5}
        .thin{fill:none;stroke:#111827;stroke-width:1.2}
        .med{fill:none;stroke:#111827;stroke-width:2.2}
        .heavy{fill:none;stroke:#111827;stroke-width:4}
        .title{font:800 28px Inter,ui-sans-serif,system-ui,sans-serif;fill:#111827}
        .subtitle{font:500 15px Inter,ui-sans-serif,system-ui,sans-serif;fill:#5b6470}
        .sheet-no{font:900 42px Inter,ui-sans-serif,system-ui,sans-serif;fill:#111827}
        .label{font:750 22px Inter,ui-sans-serif,system-ui,sans-serif;fill:#111827}
        .small{font:600 16px Inter,ui-sans-serif,system-ui,sans-serif;fill:#111827}
        .tiny{font:600 13px Inter,ui-sans-serif,system-ui,sans-serif;fill:#111827}
        .note{font:500 15px Inter,ui-sans-serif,system-ui,sans-serif;fill:#5b6470}
        .dimtxt{font:800 17px Inter,ui-sans-serif,system-ui,sans-serif;fill:#111827}
        .key{font:800 13px Inter,ui-sans-serif,system-ui,sans-serif;fill:#fff}
      </style>
    </defs>
  <rect width="1600" height="1100" class="bg"/>
  <rect x="42" y="42" width="1516" height="1016" class="sheet-border"/>
  <line x1="42" y1="980" x2="1558" y2="980" class="title-rule"/>
  <line x1="1138" y1="980" x2="1138" y2="1058" class="title-rule"/>
  <text x="66" y="1018" class="title">Front Elevation</text>
  <text x="66" y="1046" class="subtitle">One integrated shed form; sauna and sidecar read as one building</text>
  <text x="1170" y="1026" class="sheet-no">A301</text>
  <text x="1170" y="1050" class="tiny">Side-yard sauna planning set | not stamped</text>
  
