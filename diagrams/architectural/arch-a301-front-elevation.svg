      <path d="M232 180 L1158 216 L1158 238 L232 202 Z" fill="#e6eaee" stroke="#121820" stroke-width="3"/>
      <rect x="406" y="320" width="180" height="480" class="" fill="#fffdf8" stroke="#121820" stroke-width="2.5"/>
      <rect x="430" y="362" width="132" height="402" class="" fill="#dcecf7" stroke="#121820" stroke-width="1.5"/>
      <text x="496" y="834" class="tiny" text-anchor="middle" >30 x 80 sauna door</text>
      <rect x="832" y="344" width="180" height="456" class="" fill="#f0eadf" stroke="#121820" stroke-width="2.2"/>
      <line x1="922" y1="344" x2="922" y2="800" class="thin"/>
      <text x="922" y="834" class="tiny" text-anchor="middle" >sidecar storage door</text>
      <line x1="706" y1="224" x2="706" y2="800" class="med"/>
      <line x1="742" y1="224" x2="742" y2="800" class="med"/>
      
    <line x1="250" y1="116" x2="250" y2="146" class="ext"/>
    <line x1="1138" y1="116" x2="1138" y2="146" class="ext"/>
    <line x1="250" y1="138" x2="1138" y2="138" class="dim"/>
    <text x="694" y="130" class="dimtxt" text-anchor="middle" >148 exterior wall footprint</text>
      
    <line x1="334" y1="856" x2="334" y2="886" class="ext"/>
    <line x1="1054" y1="856" x2="1054" y2="886" class="ext"/>
    <line x1="334" y1="878" x2="1054" y2="878" class="dim"/>
    <text x="694" y="870" class="dimtxt" text-anchor="middle" >120 existing DG pad</text>
      
    <line x1="188" y1="800" x2="220" y2="800" class="ext"/>
    <line x1="188" y1="224" x2="220" y2="224" class="ext"/>
    <line x1="196" y1="800" x2="196" y2="224" class="dim"/>
    <text x="188" y="512" class="dimtxt" text-anchor="middle" transform="rotate(-90 188 512)">96 wall height planning</text>
      
    <path d="M1162 216 L1234 144" class="thin"/>
    <circle cx="1162" cy="216" r="4" fill="#121820"/>
    <text x="1242" y="149" class="tiny" text-anchor="start" >controlled drip/gutter side</text>
      
    <path d="M496 312 L1234 282" class="thin"/>
    <circle cx="496" cy="312" r="4" fill="#121820"/>
    <text x="1242" y="287" class="tiny" text-anchor="start" >door needs pan + head flashing</text>
      <text x="694" y="96" class="label" text-anchor="middle" >Front / approach elevation</text>
      <g transform="translate(1160 235)">
        <text x="0" y="0" class="label" text-anchor="start" >Exterior intent</text>
        <text x="0" y="38" class="note" text-anchor="start" >1. One siding pattern across sauna and sidecar.</text>
        <text x="0" y="70" class="note" text-anchor="start" >2. Sidecar must look integrated, not attached later.</text>
        <text x="0" y="102" class="note" text-anchor="start" >3. Keep roof water away from panel and fence.</text>
        <text x="0" y="134" class="note" text-anchor="start" >4. Use warm shielded light near landing.</text>
        <text x="0" y="166" class="note" text-anchor="start" >5. Maintain service access around electrical panel.</text>
      </g>
</svg>