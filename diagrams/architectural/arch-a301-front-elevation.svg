      <line x1="692" y1="229" x2="692" y2="805" class="med"/>
      <line x1="728" y1="229" x2="728" y2="805" class="med"/>
      
    <circle cx="506" cy="301" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="506" y="306" class="key" text-anchor="middle" >1</text>
      
    <circle cx="962" cy="325" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="962" y="330" class="key" text-anchor="middle" >2</text>
      
    <circle cx="1126" cy="217" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="1126" y="222" class="key" text-anchor="middle" >3</text>
      
    <circle cx="270" cy="773" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="270" y="778" class="key" text-anchor="middle" >4</text>
      
