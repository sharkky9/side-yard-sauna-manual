    <line x1="146" y1="805" x2="186" y2="805" class="ext"/>
    <line x1="146" y1="229" x2="186" y2="229" class="ext"/>
    <line x1="166" y1="805" x2="166" y2="229" class="dim"/>
    <line x1="158" y1="797" x2="174" y2="813" class="dim"/>
    <line x1="158" y1="221" x2="174" y2="237" class="dim"/>
    <text x="156" y="517" class="dimtxt" text-anchor="middle" transform="rotate(-90 156 517)">96 in wall height</text>
      <text x="506" y="839" class="small" text-anchor="middle" >sauna door</text>
      <text x="962" y="839" class="small" text-anchor="middle" >storage door</text>
      
    <g transform="translate(1190 250)">
      <text x="0" y="0" class="label" text-anchor="start" >Elevation keynotes</text>
      
      
    <circle cx="13" cy="31" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="13" y="36" class="key" text-anchor="middle" >1</text>
      <text x="38" y="36" class="note" text-anchor="start" >Sauna door gets sill pan, side flashing,</text><text x="38" y="55" class="note" text-anchor="start" >head flashing.</text>
      
    <circle cx="13" cy="95" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="13" y="100" class="key" text-anchor="middle" >2</text>
      <text x="38" y="100" class="note" text-anchor="start" >Sidecar door gets the same exterior</text><text x="38" y="119" class="note" text-anchor="start" >flashing discipline.</text>
      
    <circle cx="13" cy="159" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="13" y="164" class="key" text-anchor="middle" >3</text>
      <text x="38" y="164" class="note" text-anchor="start" >Control roof water; avoid panel/fence/pier</text><text x="38" y="183" class="note" text-anchor="start" >splash.</text>
      
    <circle cx="13" cy="223" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="13" y="228" class="key" text-anchor="middle" >4</text>
      <text x="38" y="228" class="note" text-anchor="start" >Keep lower trim sacrificial and away from</text><text x="38" y="247" class="note" text-anchor="start" >splash where possible.</text>
    </g>
      <g transform="translate(1190 558)"><rect x="0" y="0" width="340" height="176" class="object-light" fill="#fffdf8"/><text x="14" y="27" class="small" text-anchor="start" >Exterior intent</text><line x1="0" y1="40" x2="340" y2="40" class="thin"/><line x1="0" y1="74" x2="340" y2="74" class="thin"/><text x="14" y="63" class="tiny" text-anchor="start" >Siding</text><text x="164" y="63" class="tiny" text-anchor="start" >one pattern across both bays</text><line x1="0" y1="108" x2="340" y2="108" class="thin"/><text x="14" y="97" class="tiny" text-anchor="start" >Roof</text><text x="164" y="97" class="tiny" text-anchor="start" >single shed plane</text><line x1="0" y1="142" x2="340" y2="142" class="thin"/><text x="14" y="131" class="tiny" text-anchor="start" >Lighting</text><text x="164" y="131" class="tiny" text-anchor="start" >shielded warm exterior light</text><line x1="0" y1="176" x2="340" y2="176" class="thin"/><text x="14" y="165" class="tiny" text-anchor="start" >Trim</text><text x="164" y="165" class="tiny" text-anchor="start" >simple, durable, replaceable</text><line x1="150" y1="40" x2="150" y2="176" class="thin"/></g>
</svg>