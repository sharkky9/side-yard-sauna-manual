    <text x="64" y="1052" class="note">The inch that keeps water out of hidden framing</text>
    <text x="1190" y="1030" class="sheetno">A401</text>
    <text x="1190" y="1056" class="note">Side Yard Sauna · revised sidecar scheme · dimensions in inches</text>
  
