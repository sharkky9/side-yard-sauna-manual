    <text x="998" y="665" class="tiny" text-anchor="start" >sloped tile / cleanable finish under removable duckboards</text>
      <text x="554" y="264" class="label" text-anchor="middle" >Sauna interior side</text>
      <text x="770" y="264" class="label" text-anchor="middle" >Wall layers</text>
      <g transform="translate(990 720)">
        <text x="0" y="0" class="label" text-anchor="start" >Hold point</text>
        <text x="0" y="38" class="note" text-anchor="start" >Do not install cladding until this base detail is visible,</text>
