  <line x1="1138" y1="980" x2="1138" y2="1058" class="title-rule"/>
  <text x="66" y="1018" class="title">Wall Base And Pier Detail</text>
  <text x="66" y="1046" class="subtitle">Two details that decide water durability: hot-room base and pier-to-beam standoff</text>
  <text x="1170" y="1026" class="sheet-no">A401</text>
  <text x="1170" y="1050" class="tiny">Side-yard sauna planning set | not stamped</text>
  
      <text x="170" y="132" class="label" text-anchor="start" >Detail 1 - hot-room wall base</text>
      <rect x="380" y="190" width="88" height="620" class="" fill="#d9dde3" stroke="#111827" stroke-width="3"/>
      <rect x="468" y="190" width="28" height="620" class="" fill="#f5df9f" stroke="#111827" stroke-width="1.4"/>
      <rect x="496" y="190" width="12" height="620" class="" fill="#cbd4dc" stroke="#111827" stroke-width="1.2"/>
      <rect x="526" y="190" width="32" height="620" class="" fill="#ecd7b9" stroke="#111827" stroke-width="1.4"/>
      <rect x="558" y="190" width="28" height="620" class="" fill="url(#wood-hatch)" stroke="#111827" stroke-width="1.3"/>
      <rect x="240" y="690" width="520" height="36" class="" fill="#d4d8de" stroke="#111827" stroke-width="2"/>
      <rect x="240" y="652" width="520" height="38" class="" fill="#e6ded1" stroke="#111827" stroke-width="1.5"/>
      <rect x="240" y="636" width="520" height="16" class="" fill="#34495a" stroke="#111827" stroke-width="1.5"/>
      <path d="M242 636 L586 636 L586 436 L538 436 L538 612 L242 612 Z" fill="#8bb2c8" opacity="0.28" stroke="#245f9f" stroke-width="2"/>
      <rect x="558" y="588" width="28" height="64" class="" fill="#fffdf8" stroke="#fffdf8"/>
      <line x1="558" y1="588" x2="586" y2="588" class="thin"/>
      <rect x="524" y="600" width="64" height="28" class="" fill="#1f2937" stroke="#111827" stroke-width="1.2"/>
      
    <circle cx="575" cy="600" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="575" y="605" class="key" text-anchor="middle" >1</text>
      
    <circle cx="515" cy="262" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="515" y="267" class="key" text-anchor="middle" >2</text>
      
    <circle cx="384" cy="690" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="384" y="695" class="key" text-anchor="middle" >3</text>
      
    <circle cx="272" cy="642" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="272" y="647" class="key" text-anchor="middle" >4</text>
      <text x="626" y="266" class="note" text-anchor="start" >1  Cladding stops above floor.</text><text x="626" y="301" class="note" text-anchor="start" >   Leave open shadow gap.</text><text x="626" y="336" class="note" text-anchor="start" >2  Foil is continuous and taped.</text><text x="626" y="371" class="note" text-anchor="start" >3  Waterproofing turns up 4-6 in.</text><text x="626" y="406" class="note" text-anchor="start" >4  Sloped finish under duckboards.</text>
      <text x="780" y="132" class="label" text-anchor="start" >Detail 2 - pier, post, beam, and joist</text>
      <rect x="970" y="600" width="110" height="210" class="" fill="#cfd5dd" stroke="#111827" stroke-width="3"/>
      <rect x="958" y="560" width="134" height="40" class="" fill="#e7eaee" stroke="#111827" stroke-width="2"/>
      <rect x="990" y="448" width="70" height="112" class="" fill="#d4b07a" stroke="#111827" stroke-width="2.4"/>
      <rect x="920" y="396" width="210" height="52" class="" fill="#c99d5d" stroke="#111827" stroke-width="2.4"/>
      <rect x="868" y="338" width="316" height="42" class="" fill="#e5c99f" stroke="#111827" stroke-width="2"/>
      <line x1="878" y1="338" x2="878" y2="380" class="thin"/><line x1="932" y1="338" x2="932" y2="380" class="thin"/><line x1="986" y1="338" x2="986" y2="380" class="thin"/><line x1="1040" y1="338" x2="1040" y2="380" class="thin"/><line x1="1094" y1="338" x2="1094" y2="380" class="thin"/><line x1="1148" y1="338" x2="1148" y2="380" class="thin"/>
      <rect x="868" y="296" width="316" height="42" class="" fill="#dfe5eb" stroke="#111827" stroke-width="1.6"/>
      <rect x="966" y="568" width="118" height="20" class="" fill="#adb5bd" stroke="#111827" stroke-width="1.4"/>
      
    <circle cx="1094" cy="306" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="1094" y="311" class="key" text-anchor="middle" >5</text>
      
    <circle cx="1160" cy="358" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="1160" y="363" class="key" text-anchor="middle" >6</text>
      
    <circle cx="1140" cy="422" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="1140" y="427" class="key" text-anchor="middle" >7</text>
      
    <circle cx="1080" cy="580" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="1080" y="585" class="key" text-anchor="middle" >8</text>
      <text x="1250" y="306" class="note" text-anchor="start" >5  Subfloor over mesh and insulation.</text><text x="1250" y="341" class="note" text-anchor="start" >6  2x8 joists run left-right.</text><text x="1250" y="376" class="note" text-anchor="start" >7  4x6 beam over short 6x6 post.</text><text x="1250" y="411" class="note" text-anchor="start" >8  Standoff keeps post above concrete.</text>
      <g transform="translate(1030 708)"><rect x="0" y="0" width="380" height="142" class="object-light" fill="#fffdf8"/><text x="14" y="27" class="small" text-anchor="start" >Field hold points</text><line x1="0" y1="40" x2="380" y2="40" class="thin"/><line x1="0" y1="74" x2="380" y2="74" class="thin"/><text x="14" y="63" class="tiny" text-anchor="start" >Before cover</text><text x="164" y="63" class="tiny" text-anchor="start" >photo hidden layers</text><line x1="0" y1="108" x2="380" y2="108" class="thin"/><text x="14" y="97" class="tiny" text-anchor="start" >Before cladding</text><text x="164" y="97" class="tiny" text-anchor="start" >confirm base gap and foil laps</text><line x1="0" y1="142" x2="380" y2="142" class="thin"/><text x="14" y="131" class="tiny" text-anchor="start" >Before benches</text><text x="164" y="131" class="tiny" text-anchor="start" >cold mockup body positions</text><line x1="150" y1="40" x2="150" y2="142" class="thin"/></g>
