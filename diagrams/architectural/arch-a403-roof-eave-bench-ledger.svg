  <text x="66" y="1018" class="title">Roof Eave And Bench Ledger Detail</text>
  <text x="66" y="1046" class="subtitle">Moisture exits at the shell; bench loads go into framing, not cladding</text>
  <text x="1170" y="1026" class="sheet-no">A403</text>
  <text x="1170" y="1050" class="tiny">Side-yard sauna planning set | not stamped</text>
  
      <text x="160" y="132" class="label" text-anchor="start" >Detail 1 - vented eave / rainscreen exit</text>
      <path d="M250 294 L720 238 L728 304 L260 360 Z" fill="#e7eaee" stroke="#111827" stroke-width="3"/>
      <rect x="370" y="358" width="86" height="360" class="" fill="#d9dde3" stroke="#111827" stroke-width="3"/>
      <rect x="456" y="358" width="24" height="360" class="" fill="#f4df9f" stroke="#111827" stroke-width="1.2"/>
      <rect x="500" y="358" width="38" height="360" class="" fill="#e9d8bd" stroke="#111827" stroke-width="1.2"/>
      <rect x="546" y="358" width="28" height="360" class="" fill="url(#wood-hatch)" stroke="#111827" stroke-width="1.2"/>
      <rect x="350" y="346" width="250" height="24" class="" fill="#1f2937" stroke="#111827" stroke-width="1.2"/>
      <rect x="340" y="720" width="258" height="22" class="" fill="#1f2937" stroke="#111827" stroke-width="1.2"/>
      
    <circle cx="598" cy="346" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="598" y="351" class="key" text-anchor="middle" >1</text>
      
    <circle cx="340" cy="720" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="340" y="725" class="key" text-anchor="middle" >2</text>
      
    <circle cx="486" cy="392" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="486" y="397" class="key" text-anchor="middle" >3</text>
      <text x="630" y="358" class="note" text-anchor="start" >1  Drip edge and roof underlayment terminate cleanly.</text><text x="630" y="394" class="note" text-anchor="start" >2  Rainscreen exits through insect-screened gap.</text><text x="630" y="430" class="note" text-anchor="start" >3  Roof/ceiling cavity does not trap wet air.</text>
      <text x="820" y="132" class="label" text-anchor="start" >Detail 2 - bench ledger into framed blocking</text>
      <rect x="980" y="258" width="90" height="520" class="" fill="#d9dde3" stroke="#111827" stroke-width="3"/>
      <rect x="1070" y="258" width="18" height="520" class="" fill="#cbd4dc" stroke="#111827" stroke-width="1.2"/>
      <rect x="1112" y="258" width="36" height="520" class="" fill="#e9d8bd" stroke="#111827" stroke-width="1.2"/>
      <rect x="1148" y="258" width="28" height="520" class="" fill="url(#wood-hatch)" stroke="#111827" stroke-width="1.2"/>
      <rect x="910" y="430" width="238" height="38" class="" fill="#d0a261" stroke="#111827" stroke-width="2.4"/>
      <rect x="912" y="380" width="70" height="120" class="" fill="#c89d64" stroke="#111827" stroke-width="2"/>
      <circle cx="1006" cy="449" r="5" class="" fill="#111827" stroke="#111827"/><circle cx="1034" cy="449" r="5" class="" fill="#111827" stroke="#111827"/><circle cx="1062" cy="449" r="5" class="" fill="#111827" stroke="#111827"/><circle cx="1090" cy="449" r="5" class="" fill="#111827" stroke="#111827"/><circle cx="1118" cy="449" r="5" class="" fill="#111827" stroke="#111827"/>
      
    <circle cx="988" cy="378" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="988" y="383" class="key" text-anchor="middle" >4</text>
      
    <circle cx="1078" cy="414" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="1078" y="419" class="key" text-anchor="middle" >5</text>
      
    <circle cx="1164" cy="332" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="1164" y="337" class="key" text-anchor="middle" >6</text>
      <text x="1225" y="378" class="note" text-anchor="start" >4  Solid blocking is framed before insulation/foil.</text><text x="1225" y="414" class="note" text-anchor="start" >5  Ledger fasteners land in blocking, not cladding.</text><text x="1225" y="450" class="note" text-anchor="start" >6  Foil penetrations are taped before furring/cladding.</text>
      <g transform="translate(1010 742)"><rect x="0" y="0" width="365" height="142" class="object-light" fill="#fffdf8"/><text x="14" y="27" class="small" text-anchor="start" >Bench hold point</text><line x1="0" y1="40" x2="365" y2="40" class="thin"/><line x1="0" y1="74" x2="365" y2="74" class="thin"/><text x="14" y="63" class="tiny" text-anchor="start" >Mock up</text><text x="134" y="63" class="tiny" text-anchor="start" >upper, foot, lower step, guard</text><line x1="0" y1="108" x2="365" y2="108" class="thin"/><text x="14" y="97" class="tiny" text-anchor="start" >Fasteners</text><text x="134" y="97" class="tiny" text-anchor="start" >stainless in hot-room finish</text><line x1="0" y1="142" x2="365" y2="142" class="thin"/><text x="14" y="131" class="tiny" text-anchor="start" >Edges</text><text x="134" y="131" class="tiny" text-anchor="start" >round over body-contact wood</text><line x1="120" y1="40" x2="120" y2="142" class="thin"/></g>
