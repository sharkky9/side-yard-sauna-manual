  <text x="66" y="1046" class="subtitle">Existing 120 x 96 DG pad used as sauna-side datum; sidecar extension lands on new soil piers</text>
  <text x="1170" y="1026" class="sheet-no">C101</text>
  <text x="1170" y="1050" class="tiny">Side-yard sauna planning set | not stamped</text>
  
