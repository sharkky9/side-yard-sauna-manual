    <line x1="196" y1="778" x2="212" y2="794" class="dim"/>
    <text x="194" y="498" class="dimtxt" text-anchor="middle" transform="rotate(-90 194 498)">96 in exterior depth</text>
      
    <line x1="142" y1="204" x2="182" y2="204" class="ext"/>
    <line x1="142" y1="792" x2="182" y2="792" class="ext"/>
