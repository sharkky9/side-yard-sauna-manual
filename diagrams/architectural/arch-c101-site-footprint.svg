      <text x="948" y="505" class="label" text-anchor="middle" >sidecar storage</text>
      <text x="630" y="822" class="small" text-anchor="middle" >10 ft x 8 ft existing DG pad</text>
      <text x="1080" y="822" class="small" text-anchor="middle" >new soil footings zone</text>
      
