    <circle cx="1045" cy="274" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="1045" y="279" class="key" text-anchor="middle" >2</text>
      
    <circle cx="1130" cy="754" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
