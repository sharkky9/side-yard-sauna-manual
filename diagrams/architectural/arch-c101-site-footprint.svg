      <line x1="614" y1="958" x2="814" y2="958" class="med"/>
      <path d="M814 958 l-18 -8 l0 16 z" fill="#111827"/>
      
    <g transform="translate(1230 232)">
      <text x="0" y="0" class="label" text-anchor="start" >What this sheet decides</text>
      
      
    <circle cx="13" cy="31" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="13" y="36" class="key" text-anchor="middle" >1</text>
      <text x="38" y="36" class="note" text-anchor="start" >DG pad is a reference surface, not the</text><text x="38" y="55" class="note" text-anchor="start" >whole foundation.</text>
      
    <circle cx="13" cy="95" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="13" y="100" class="key" text-anchor="middle" >2</text>
      <text x="38" y="100" class="note" text-anchor="start" >Sidecar-side piers are dug in native soil.</text>
      
    <circle cx="13" cy="140" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="13" y="145" class="key" text-anchor="middle" >3</text>
      <text x="38" y="145" class="note" text-anchor="start" >Roof and drainage must respect fence/panel</text><text x="38" y="164" class="note" text-anchor="start" >clearance.</text>
    </g>
      <g transform="translate(1230 500)"><rect x="0" y="0" width="340" height="210" class="object-light" fill="#fffdf8"/><text x="14" y="27" class="small" text-anchor="start" >Footprint schedule</text><line x1="0" y1="40" x2="340" y2="40" class="thin"/><line x1="0" y1="74" x2="340" y2="74" class="thin"/><text x="14" y="63" class="tiny" text-anchor="start" >Hot room clear</text><text x="164" y="63" class="tiny" text-anchor="start" >70 x 84 in</text><line x1="0" y1="108" x2="340" y2="108" class="thin"/><text x="14" y="97" class="tiny" text-anchor="start" >Sidecar clear</text><text x="164" y="97" class="tiny" text-anchor="start" >60 x 84 in</text><line x1="0" y1="142" x2="340" y2="142" class="thin"/><text x="14" y="131" class="tiny" text-anchor="start" >Wall footprint</text><text x="164" y="131" class="tiny" text-anchor="start" >148 x 96 in</text><line x1="0" y1="176" x2="340" y2="176" class="thin"/><text x="14" y="165" class="tiny" text-anchor="start" >Platform target</text><text x="164" y="165" class="tiny" text-anchor="start" >150 x 98 in</text><line x1="0" y1="210" x2="340" y2="210" class="thin"/><text x="14" y="199" class="tiny" text-anchor="start" >Existing pad</text><text x="164" y="199" class="tiny" text-anchor="start" >120 x 96 in</text><line x1="150" y1="40" x2="150" y2="210" class="thin"/></g>
</svg>