      <circle cx="436" cy="690" r="54" fill="#2b2f36" stroke="#121820" stroke-width="2"/>
      <rect x="352" y="606" width="168" height="168" class="" fill="none" stroke="#a33a2a" stroke-width="2" stroke-dasharray="8 6"/>
      <path d="M472 654 C568 480, 622 348, 670 264" fill="none" stroke="#245f9f" stroke-width="3" marker-end="url(#arrow-blue)"/>
      <path d="M742 744 C550 744, 394 720, 388 672" fill="none" stroke="#245f9f" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow-blue)"/>
      <rect x="284" y="612" width="5" height="108" class="" fill="#245f9f" stroke="#245f9f" stroke-width="1"/>
      <rect x="787" y="660" width="6" height="66" class="" fill="#245f9f" stroke="#245f9f" stroke-width="1"/>
      <rect x="787" y="288" width="6" height="60" class="" fill="#245f9f" stroke="#245f9f" stroke-width="1"/>
      <text x="264" y="624" class="tiny" text-anchor="end" >supply</text>
      <text x="780" y="672" class="tiny" text-anchor="end" >low exhaust</text>
      <text x="780" y="318" class="tiny" text-anchor="end" >drying vent</text>
      
    <line x1="190" y1="780" x2="222" y2="780" class="ext"/>
    <line x1="190" y1="204" x2="222" y2="204" class="ext"/>
    <line x1="198" y1="780" x2="198" y2="204" class="dim"/>
    <text x="190" y="492" class="dimtxt" text-anchor="middle" transform="rotate(-90 190 492)">96 finished ceiling target</text>
      
    <line x1="864" y1="474" x2="896" y2="474" class="ext"/>
    <line x1="864" y1="204" x2="896" y2="204" class="ext"/>
    <line x1="872" y1="474" x2="872" y2="204" class="dim"/>
    <text x="864" y="339" class="dimtxt" text-anchor="middle" transform="rotate(-90 864 339)">45 top bench to ceiling</text>
      
    <line x1="904" y1="780" x2="936" y2="780" class="ext"/>
    <line x1="904" y1="474" x2="936" y2="474" class="ext"/>
    <line x1="912" y1="780" x2="912" y2="474" class="dim"/>
    <text x="904" y="627" class="dimtxt" text-anchor="middle" transform="rotate(-90 904 627)">51 upper bench</text>
      
    <line x1="944" y1="780" x2="976" y2="780" class="ext"/>
    <line x1="944" y1="570" x2="976" y2="570" class="ext"/>
    <line x1="952" y1="780" x2="952" y2="570" class="dim"/>
    <text x="944" y="675" class="dimtxt" text-anchor="middle" transform="rotate(-90 944 675)">35 foot platform</text>
      
    <line x1="302" y1="780" x2="334" y2="780" class="ext"/>
    <line x1="302" y1="678" x2="334" y2="678" class="ext"/>
    <line x1="310" y1="780" x2="310" y2="678" class="dim"/>
    <text x="302" y="729" class="dimtxt" text-anchor="middle" transform="rotate(-90 302 729)">17 lower step</text>
      
    <line x1="286" y1="812" x2="286" y2="842" class="ext"/>
    <line x1="790" y1="812" x2="790" y2="842" class="ext"/>
    <line x1="286" y1="834" x2="790" y2="834" class="dim"/>
    <text x="538" y="826" class="dimtxt" text-anchor="middle" >84 clear hot-room depth</text>
      
    <circle cx="718" cy="456" r="12" fill="#121820" stroke="#fffdf8" stroke-width="2"/>
    <text x="718" y="461" class="badge" text-anchor="middle" >1</text>
      
    <circle cx="670" cy="552" r="12" fill="#121820" stroke="#fffdf8" stroke-width="2"/>
    <text x="670" y="557" class="badge" text-anchor="middle" >2</text>
      
    <circle cx="508" cy="612" r="12" fill="#121820" stroke="#fffdf8" stroke-width="2"/>
    <text x="508" y="617" class="badge" text-anchor="middle" >3</text>
      
    <circle cx="788" cy="312" r="12" fill="#121820" stroke="#fffdf8" stroke-width="2"/>
    <text x="788" y="317" class="badge" text-anchor="middle" >4</text>
      <g transform="translate(1055 292)">
        <text x="0" y="0" class="label" text-anchor="start" >Section notes</text>
        <text x="0" y="38" class="note" text-anchor="start" >1. Upper bench: 24 in comfortable sitting depth.</text>
        <text x="0" y="70" class="note" text-anchor="start" >2. Foot platform supports main seats and return posture.</text>
        <text x="0" y="102" class="note" text-anchor="start" >3. HIVE Mini 9; confirm current clearances at install.</text>
        <text x="0" y="134" class="note" text-anchor="start" >4. High vent closes during bathing; opens for drying.</text>
      </g>
      <g transform="translate(1055 530)">
        <text x="0" y="0" class="label" text-anchor="start" >Performance targets</text>
        <text x="0" y="38" class="note" text-anchor="start" >• Feet stay high, above the stone line.</text>
        <text x="0" y="70" class="note" text-anchor="start" >• Room is for sitting, not lying down.</text>
        <text x="0" y="102" class="note" text-anchor="start" >• Vents are framed before foil/cladding.</text>
        <text x="0" y="134" class="note" text-anchor="start" >• Finished ceiling/bench heights are held hard.</text>
      </g>
</svg>