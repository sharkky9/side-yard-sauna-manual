  <rect width="1600" height="1100" class="bg"/>
  <rect x="42" y="42" width="1516" height="1016" class="sheet-border"/>
  <line x1="42" y1="980" x2="1558" y2="980" class="title-rule"/>
  <line x1="1138" y1="980" x2="1138" y2="1058" class="title-rule"/>
  <text x="66" y="1018" class="title">Door Threshold And Flashing Detail</text>
  <text x="66" y="1046" class="subtitle">The sauna door is a weather opening first; the beautiful glass panel comes second</text>
  <text x="1170" y="1026" class="sheet-no">A402</text>
  <text x="1170" y="1050" class="tiny">Side-yard sauna planning set | not stamped</text>
  
      <text x="170" y="140" class="label" text-anchor="start" >Detail 1 - threshold pan section</text>
      <rect x="260" y="508" width="540" height="42" class="" fill="#dfe5eb" stroke="#111827" stroke-width="2"/>
      <rect x="260" y="468" width="540" height="40" class="" fill="#e9dfd0" stroke="#111827" stroke-width="1.6"/>
      <path d="M300 465 L670 465 L670 408 L718 408 L718 484 L300 484 Z" fill="#91afc2" opacity="0.3" stroke="#245f9f" stroke-width="2"/>
      <rect x="502" y="298" width="92" height="184" class="" fill="#f0e4d2" stroke="#111827" stroke-width="2.4"/>
      <rect x="330" y="484" width="172" height="26" class="" fill="#d6b27a" stroke="#111827" stroke-width="1.6"/>
      <rect x="594" y="484" width="140" height="26" class="" fill="#d6b27a" stroke="#111827" stroke-width="1.6"/>
      
    <circle cx="670" cy="420" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="670" y="425" class="key" text-anchor="middle" >1</text>
      
    <circle cx="550" cy="282" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="550" y="287" class="key" text-anchor="middle" >2</text>
      
    <circle cx="312" cy="484" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="312" y="489" class="key" text-anchor="middle" >3</text>
      
    <circle cx="718" cy="484" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="718" y="489" class="key" text-anchor="middle" >4</text>
      <text x="845" y="294" class="note" text-anchor="start" >1  Pan has back dam and end dams; slope out.</text><text x="845" y="330" class="note" text-anchor="start" >2  Door jamb set after pan, shimmed, and fastened plumb.</text><text x="845" y="366" class="note" text-anchor="start" >3  Interior duckboard/floor finish remains removable.</text><text x="845" y="402" class="note" text-anchor="start" >4  Exterior threshold/landing sheds water away.</text>
      <text x="170" y="714" class="label" text-anchor="start" >Detail 2 - head and side flashing sequence</text>
      <rect x="320" y="772" width="290" height="190" class="" fill="#fffdf8" stroke="#111827" stroke-width="2.4"/>
      <rect x="380" y="824" width="170" height="112" class="" fill="#dcecf7" stroke="#111827" stroke-width="1.4"/>
      <rect x="302" y="746" width="326" height="24" class="" fill="#9aa8b5" stroke="#111827" stroke-width="1.4"/>
      <rect x="296" y="770" width="28" height="206" class="" fill="#cbd4dc" stroke="#111827" stroke-width="1.2"/>
      <rect x="606" y="770" width="28" height="206" class="" fill="#cbd4dc" stroke="#111827" stroke-width="1.2"/>
      
    <circle cx="316" cy="738" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="316" y="743" class="key" text-anchor="middle" >5</text>
      
    <circle cx="296" cy="798" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="296" y="803" class="key" text-anchor="middle" >6</text>
      
    <circle cx="628" cy="798" r="13" fill="#111827" stroke="#fffdf8" stroke-width="2"/>
    <text x="628" y="803" class="key" text-anchor="middle" >7</text>
      <text x="845" y="762" class="note" text-anchor="start" >5  Head flashing laps over sides.</text><text x="845" y="798" class="note" text-anchor="start" >6  Side flashing laps over pan.</text><text x="845" y="834" class="note" text-anchor="start" >7  WRB laps shingle-style.</text>
      <g transform="translate(1040 760)"><rect x="0" y="0" width="390" height="142" class="object-light" fill="#fffdf8"/><text x="14" y="27" class="small" text-anchor="start" >Door hold point</text><line x1="0" y1="40" x2="390" y2="40" class="thin"/><line x1="0" y1="74" x2="390" y2="74" class="thin"/><text x="14" y="63" class="tiny" text-anchor="start" >Before trim</text><text x="159" y="63" class="tiny" text-anchor="start" >water-test pan/head path</text><line x1="0" y1="108" x2="390" y2="108" class="thin"/><text x="14" y="97" class="tiny" text-anchor="start" >Before siding</text><text x="159" y="97" class="tiny" text-anchor="start" >photo flashing sequence</text><line x1="0" y1="142" x2="390" y2="142" class="thin"/><text x="14" y="131" class="tiny" text-anchor="start" >Before benches</text><text x="159" y="131" class="tiny" text-anchor="start" >check trim vs heater guard</text><line x1="145" y1="40" x2="145" y2="142" class="thin"/></g>
