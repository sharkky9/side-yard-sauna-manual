        .hidden{fill:none;stroke:#5b6470;stroke-width:1.4;stroke-dasharray:8 6}
        .planning{fill:none;stroke:#a23d30;stroke-width:2.2;stroke-dasharray:10 7}
        .blue-line{fill:none;stroke:#245f9f;stroke-width:2.4}
        .blue-dash{fill:none;stroke:#245f9f;stroke-width:2;stroke-dasharray:9 6}
        .dim{fill:none;stroke:#111827;stroke-width:1.2}
        .ext{stroke:#5b6470;stroke-width:1;stroke-dasharray:5 5}
        .thin{fill:none;stroke:#111827;stroke-width:1.2}
        .med{fill:none;stroke:#111827;stroke-width:2.2}
        .heavy{fill:none;stroke:#111827;stroke-width:4}
        .title{font:800 28px Inter,ui-sans-serif,system-ui,sans-serif;fill:#111827}
        .subtitle{font:500 15px Inter,ui-sans-serif,system-ui,sans-serif;fill:#5b6470}
        .sheet-no{font:900 42px Inter,ui-sans-serif,system-ui,sans-serif;fill:#111827}
        .label{font:750 22px Inter,ui-sans-serif,system-ui,sans-serif;fill:#111827}
        .small{font:600 16px Inter,ui-sans-serif,system-ui,sans-serif;fill:#111827}
        .tiny{font:600 13px Inter,ui-sans-serif,system-ui,sans-serif;fill:#111827}
        .note{font:500 15px Inter,ui-sans-serif,system-ui,sans-serif;fill:#5b6470}
        .dimtxt{font:800 17px Inter,ui-sans-serif,system-ui,sans-serif;fill:#111827}
        .key{font:800 13px Inter,ui-sans-serif,system-ui,sans-serif;fill:#fff}
      </style>
