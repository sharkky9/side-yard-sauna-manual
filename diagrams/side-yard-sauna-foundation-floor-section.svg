<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Side-yard sauna foundation and floor section</title>
  <desc id="desc">Side section showing a decomposed granite pad, concrete piers with standoff bases, a raised pressure-treated platform, insulated solid sauna floor, removable duckboards, rodent screen, and a shed roof that drains to an accessible edge.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .title { font-size: 28px; font-weight: 700; }
      .sub { font-size: 16px; fill: #475569; }
      .label { font-size: 17px; font-weight: 650; }
      .note { font-size: 14px; fill: #475569; }
      .small { font-size: 13px; fill: #475569; }
      .ground { fill: #f4f1e8; stroke: #8b7b58; stroke-width: 2; }
      .soil { fill: #e7d7b7; }
      .concrete { fill: #d1d5db; stroke: #4b5563; stroke-width: 2.5; }
      .metal { fill: #94a3b8; stroke: #475569; stroke-width: 2; }
      .pt { fill: #c8b58b; stroke: #6b5b36; stroke-width: 2.5; }
      .wood { fill: #f1c99a; stroke: #9a6a36; stroke-width: 2; }
      .insul { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .membrane { stroke: #2563eb; stroke-width: 5; fill: none; }
      .wall { fill: #f8fafc; stroke: #111827; stroke-width: 5; }
      .roof { fill: #e5e7eb; stroke: #111827; stroke-width: 4; }
      .screen { fill: url(#mesh); stroke: #374151; stroke-width: 2; }
      .water { fill: none; stroke: #2563eb; stroke-width: 4; marker-end: url(#arrow-blue); }
      .dim { fill: none; stroke: #334155; stroke-width: 2.5; marker-start: url(#arrow-slate); marker-end: url(#arrow-slate); }
      .leader { fill: none; stroke: #64748b; stroke-width: 2; }
    </style>
    <pattern id="mesh" width="9" height="9" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 9 9 M 9 0 L 0 9" stroke="#64748b" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="70" y="54" class="title">Foundation and floor: keep wood out of wet dirt</text>
  <text x="70" y="82" class="sub">Side section, front at right. The DG pad is a base surface, not the structural foundation.</text>

  <rect x="80" y="620" width="1030" height="74" class="ground"/>
  <rect x="80" y="694" width="1030" height="80" class="soil"/>
  <text x="95" y="648" class="label">existing DG pad</text>
  <text x="94" y="674" class="note">fine for access and drainage, not enough by itself</text>

  <rect x="210" y="500" width="68" height="230" rx="10" class="concrete"/>
  <rect x="526" y="500" width="68" height="230" rx="10" class="concrete"/>
  <rect x="842" y="500" width="68" height="230" rx="10" class="concrete"/>
  <text x="190" y="755" class="small">pier depth/diameter per site and code</text>

  <rect x="198" y="462" width="92" height="28" rx="3" class="metal"/>
  <rect x="514" y="462" width="92" height="28" rx="3" class="metal"/>
  <rect x="830" y="462" width="92" height="28" rx="3" class="metal"/>
  <text x="940" y="481" class="label">metal standoff bases</text>
  <text x="940" y="505" class="note">better than burying posts in concrete</text>

  <rect x="150" y="435" width="810" height="26" class="pt"/>
  <rect x="170" y="397" width="770" height="35" class="pt"/>
  <text x="74" y="428" class="label">PT beams and joists</text>
  <text x="74" y="453" class="note">outside the hot-room finish layer</text>

  <rect x="190" y="322" width="730" height="72" class="insul"/>
  <rect x="190" y="303" width="730" height="20" class="wood"/>
  <path d="M 190 296 L 920 286" class="membrane"/>
  <rect x="220" y="252" width="640" height="24" class="wood"/>
  <text x="940" y="306" class="label">solid sloped floor</text>
  <text x="940" y="330" class="note">waterproof surface, then removable duckboards</text>

  <rect x="142" y="494" width="25" height="123" class="screen"/>
  <rect x="942" y="494" width="25" height="123" class="screen"/>
  <text x="75" y="526" class="label">rodent screen</text>
  <text x="75" y="550" class="note">vent the crawl space, block pests</text>

  <rect x="175" y="145" width="52" height="250" class="wall"/>
  <rect x="882" y="145" width="52" height="250" class="wall"/>
  <path d="M 165 128 L 950 95 L 958 126 L 173 160 Z" class="roof"/>
  <text x="462" y="120" class="label">single-slope roof</text>
  <text x="450" y="145" class="note">drain to accessible front/side, not toward fence or panel</text>

  <path d="M 830 286 C 875 300, 905 322, 940 354" class="water"/>
  <text x="944" y="372" class="label">controlled scupper or drain</text>

  <line x1="1050" y1="286" x2="1050" y2="620" class="dim"/>
  <text x="1066" y="462" class="small">raised platform</text>

  <text x="82" y="218" class="label">Back / fence side</text>
  <text x="900" y="218" class="label">Front / approach</text>
</svg>
