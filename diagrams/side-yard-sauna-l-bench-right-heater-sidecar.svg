<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Side-yard sauna L bench with right-side heater and storage sidecar</title>
  <desc id="desc">Top-view concept for a compact side-yard sauna. The hot room has a centered front glass door, an L-shaped upper bench on the back and left walls, a right-front heater, and a separate exterior storage sidecar on the right under the same roof.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .title { font-size: 28px; font-weight: 700; }
      .sub { font-size: 16px; fill: #475569; }
      .label { font-size: 17px; font-weight: 650; }
      .note { font-size: 14px; fill: #475569; }
      .small { font-size: 13px; fill: #475569; }
      .pad { fill: #f4f1e8; stroke: #8b7b58; stroke-width: 3; }
      .retainer { fill: none; stroke: #525252; stroke-width: 8; stroke-linecap: round; }
      .shell { fill: #f8fafc; stroke: #111827; stroke-width: 7; }
      .hotroom { fill: #fff7ed; stroke: #7c2d12; stroke-width: 3; }
      .closet { fill: #eef2ff; stroke: #4338ca; stroke-width: 3; }
      .divider { stroke: #111827; stroke-width: 6; }
      .bench { fill: #f1c99a; stroke: #9a6a36; stroke-width: 2.5; }
      .foot { fill: #f8e4c8; stroke: #b7793d; stroke-width: 2; }
      .heater { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2.5; }
      .door { fill: #dbeafe; stroke: #2563eb; stroke-width: 3; }
      .closetdoor { fill: #e0e7ff; stroke: #4338ca; stroke-width: 3; }
      .shelf { fill: #dbeafe; stroke: #334155; stroke-width: 2; }
      .pier { fill: #e5e7eb; stroke: #374151; stroke-width: 2; }
      .clear { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 7; }
      .dim { fill: none; stroke: #334155; stroke-width: 2.5; marker-start: url(#arrow); marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="70" y="54" class="title">Reference layout adapted: centered door, heater on right</text>
  <text x="70" y="82" class="sub">Top view. Door is centered on the hot room; the storage sidecar gets its own exterior door.</text>

  <rect x="95" y="145" width="760" height="608" rx="8" class="pad"/>
  <path d="M 95 145 H 855 V 753 H 95 Z" class="retainer"/>
  <text x="365" y="130" class="label">10 ft x 8 ft DG pad</text>
  <text x="383" y="790" class="label">front / side-yard approach</text>
  <text x="382" y="170" class="small">fence behind</text>

  <rect x="150" y="210" width="655" height="520" rx="6" class="shell"/>
  <rect x="180" y="240" width="455" height="460" rx="3" class="hotroom"/>
  <rect x="635" y="240" width="140" height="460" rx="3" class="closet"/>
  <line x1="635" y1="240" x2="635" y2="700" class="divider"/>

  <text x="312" y="231" class="label">hot room</text>
  <text x="657" y="231" class="label">sidecar</text>

  <circle cx="188" cy="248" r="14" class="pier"/>
  <circle cx="407" cy="248" r="14" class="pier"/>
  <circle cx="768" cy="248" r="14" class="pier"/>
  <circle cx="188" cy="478" r="14" class="pier"/>
  <circle cx="407" cy="478" r="14" class="pier"/>
  <circle cx="768" cy="478" r="14" class="pier"/>
  <circle cx="188" cy="692" r="14" class="pier"/>
  <circle cx="407" cy="692" r="14" class="pier"/>
  <circle cx="768" cy="692" r="14" class="pier"/>

  <rect x="210" y="260" width="390" height="105" rx="5" class="bench"/>
  <text x="303" y="315" class="label">back upper bench</text>

  <rect x="210" y="365" width="118" height="250" rx="5" class="bench"/>
  <text x="228" y="470" class="label">left</text>
  <text x="224" y="493" class="label">return</text>

  <rect x="352" y="398" width="230" height="82" rx="5" class="foot"/>
  <rect x="352" y="480" width="86" height="110" rx="5" class="foot"/>
  <text x="372" y="448" class="label">foot platform</text>

  <rect x="508" y="558" width="94" height="102" rx="16" class="heater"/>
  <text x="528" y="606" class="label">HUUM</text>

  <rect x="350" y="700" width="122" height="52" rx="5" class="door"/>
  <path d="M 350 700 Q 412 635 472 700" fill="none" stroke="#2563eb" stroke-width="2.5"/>

  <rect x="666" y="700" width="78" height="52" rx="5" class="closetdoor"/>
  <path d="M 666 700 Q 705 655 744 700" fill="none" stroke="#4338ca" stroke-width="2.5"/>

  <rect x="665" y="270" width="80" height="38" rx="3" class="shelf"/>
  <rect x="665" y="335" width="80" height="38" rx="3" class="shelf"/>
  <rect x="665" y="400" width="80" height="38" rx="3" class="shelf"/>
  <rect x="665" y="465" width="80" height="130" rx="3" class="clear"/>
  <text x="672" y="523" class="note">tall slot</text>

  <rect x="890" y="255" width="230" height="205" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="918" y="295" class="label">Working sizes</text>
  <text x="918" y="330" class="note">Hot room: about 7 ft</text>
  <text x="918" y="355" class="note">Sidecar: about 2-2.5 ft</text>
  <text x="918" y="390" class="note">Door centers on sauna,</text>
  <text x="918" y="415" class="note">not whole facade.</text>

  <line x1="95" y1="108" x2="855" y2="108" class="dim"/>
  <text x="450" y="101" class="small">10 ft</text>
  <line x1="880" y1="145" x2="880" y2="753" class="dim"/>
  <text x="895" y="455" class="small">8 ft</text>
</svg>
