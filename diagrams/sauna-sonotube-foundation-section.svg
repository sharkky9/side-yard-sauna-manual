<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Sonotube pier foundation section for compact sauna</title>
  <desc id="desc">A construction section showing a compact sauna platform supported by concrete sonotube piers, Simpson-style standoff post bases, short pressure-treated posts cut to level, beams, joists, insulation, and a solid sloped sauna floor above the existing decomposed granite pad.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .title { font-size: 28px; font-weight: 700; }
      .sub { font-size: 16px; fill: #475569; }
      .label { font-size: 17px; font-weight: 650; }
      .note { font-size: 14px; fill: #475569; }
      .dg { fill: #f4f1e8; stroke: #8b7b58; stroke-width: 2; }
      .soil { fill: #e7d7b7; }
      .concrete { fill: #d1d5db; stroke: #4b5563; stroke-width: 2.5; }
      .metal { fill: #94a3b8; stroke: #475569; stroke-width: 2; }
      .pt { fill: #c8b58b; stroke: #6b5b36; stroke-width: 2.5; }
      .wood { fill: #f1c99a; stroke: #9a6a36; stroke-width: 2; }
      .floor { fill: #f8fafc; stroke: #111827; stroke-width: 3; }
      .dim { fill: none; stroke: #334155; stroke-width: 2.2; marker-start: url(#arrow); marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="900" fill="#ffffff"/>
  <text x="70" y="58" class="title">Poured-pier foundation with short adjustable-height posts</text>
  <text x="70" y="86" class="sub">Side section. Existing DG remains the surface, but the load goes through concrete piers to firm soil.</text>

  <rect x="80" y="625" width="1040" height="58" class="dg"/>
  <rect x="80" y="683" width="1040" height="110" class="soil"/>
  <text x="100" y="657" class="label">existing compacted DG pad</text>

  <rect x="205" y="475" width="82" height="290" rx="10" class="concrete"/>
  <rect x="525" y="475" width="82" height="290" rx="10" class="concrete"/>
  <rect x="845" y="475" width="82" height="290" rx="10" class="concrete"/>
  <text x="942" y="575" class="label">12 in sonotube piers</text>
  <text x="942" y="600" class="note">depth and rebar per soil/code</text>

  <rect x="190" y="438" width="112" height="28" rx="3" class="metal"/>
  <rect x="510" y="438" width="112" height="28" rx="3" class="metal"/>
  <rect x="830" y="438" width="112" height="28" rx="3" class="metal"/>
  <text x="942" y="452" class="label">standoff post base</text>
  <text x="942" y="477" class="note">keeps wood off concrete</text>

  <rect x="212" y="320" width="66" height="118" class="pt"/>
  <rect x="532" y="300" width="66" height="138" class="pt"/>
  <rect x="852" y="340" width="66" height="98" class="pt"/>
  <text x="74" y="350" class="label">short PT posts</text>
  <text x="74" y="375" class="note">cut to establish a level beam plane</text>

  <rect x="150" y="278" width="835" height="34" class="pt"/>
  <rect x="175" y="236" width="785" height="38" class="pt"/>
  <text x="74" y="260" class="label">PT beams and joists</text>

  <rect x="190" y="188" width="730" height="44" class="floor"/>
  <text x="382" y="216" class="label">insulated solid sauna floor above</text>

  <line x1="1035" y1="188" x2="1035" y2="625" class="dim"/>
  <text x="1054" y="415" class="note">crawl/air space</text>
</svg>
