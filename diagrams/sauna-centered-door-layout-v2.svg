<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img">
  <title>Cleaner centered-door sauna layout</title>
  <desc>A cleaner drawing sheet for an eight by eight sauna concept, showing plan view, centered front door, balanced windows, heater at the left front, L-shaped bench return with foot support, controlled front-right scupper, and a compact bench-height inset.</desc>
  <defs>
    <marker id="water-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="dim-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <pattern id="duckboard" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(90)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#d6a974" stroke-width="3"/>
    </pattern>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #18212f;
      }
      .sheet-title { font-size: 30px; font-weight: 750; letter-spacing: 0; }
      .subtitle { font-size: 16px; fill: #526173; }
      .panel-title { font-size: 18px; font-weight: 720; }
      .label { font-size: 16px; font-weight: 680; }
      .soft-label { font-size: 14px; fill: #526173; font-weight: 560; }
      .key { font-size: 15px; fill: #263241; }
      .key-head { font-size: 17px; font-weight: 730; }
      .small { font-size: 13px; fill: #526173; }
      .wall { fill: none; stroke: #18212f; stroke-width: 14; stroke-linecap: square; }
      .floor { fill: #fbf8f1; stroke: #e3d7c5; stroke-width: 1.5; }
      .upper { fill: #e5b16f; stroke: #8a5a22; stroke-width: 2.5; }
      .lower { fill: #f0cf9f; stroke: #a66b2c; stroke-width: 2; }
      .duck { fill: url(#duckboard); stroke: #c88b43; stroke-width: 1.5; opacity: .62; }
      .heater { fill: #f8c7bd; stroke: #a23d2d; stroke-width: 2.5; }
      .heater-zone { fill: #fff1ee; stroke: #c96f60; stroke-width: 1.5; stroke-dasharray: 8 7; }
      .glass { stroke: #2f80d1; stroke-width: 8; stroke-linecap: round; }
      .door-swing { fill: none; stroke: #2f80d1; stroke-width: 2.5; }
      .water { fill: none; stroke: #2563eb; stroke-width: 3.5; marker-end: url(#water-arrow); }
      .water-soft { fill: none; stroke: #93c5fd; stroke-width: 2.5; marker-end: url(#water-arrow); opacity: .85; }
      .drain { fill: #bfdbfe; stroke: #2563eb; stroke-width: 2.5; }
      .callout { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .number { fill: #18212f; font-size: 14px; font-weight: 750; text-anchor: middle; dominant-baseline: central; }
      .number-circle { fill: #ffffff; stroke: #18212f; stroke-width: 2; }
      .section-line { stroke: #18212f; stroke-width: 3; }
      .dim { fill: none; stroke: #64748b; stroke-width: 2; marker-start: url(#dim-arrow); marker-end: url(#dim-arrow); }
    </style>
  </defs>

  <rect width="1280" height="820" fill="#f6f1e9"/>

  <text x="72" y="58" class="sheet-title">Centered-door sauna layout</text>
  <text x="72" y="86" class="subtitle">Cleaner concept drawing: plan first, height logic second. Dimensions are approximate until the actual slab and heater manual control.</text>

  <text x="72" y="132" class="panel-title">Plan view</text>
  <rect x="90" y="155" width="760" height="520" rx="6" class="floor"/>

  <path class="wall" d="M 90 155 H 850"/>
  <path class="wall" d="M 90 155 V 675"/>
  <path class="wall" d="M 850 155 V 675"/>
  <path class="wall" d="M 90 675 H 220 M 370 675 H 485 M 595 675 H 645 M 795 675 H 850"/>
  <line x1="220" y1="675" x2="370" y2="675" class="glass"/>
  <line x1="645" y1="675" x2="795" y2="675" class="glass"/>
  <path d="M 485 675 V 618 M 595 675 V 618 M 485 618 Q 540 570 595 618" class="door-swing"/>

  <rect x="130" y="192" width="680" height="88" rx="6" class="upper"/>
  <rect x="130" y="312" width="680" height="76" rx="6" class="lower"/>
  <rect x="130" y="424" width="300" height="58" rx="6" class="duck"/>
  <rect x="130" y="542" width="142" height="84" rx="18" class="heater"/>
  <rect x="114" y="524" width="174" height="120" rx="18" class="heater-zone"/>
  <rect x="690" y="425" width="120" height="178" rx="6" class="upper"/>
  <rect x="650" y="452" width="32" height="126" rx="5" class="lower"/>

  <rect x="806" y="643" width="34" height="26" rx="5" class="drain"/>
  <path d="M 520 420 C 650 472, 750 560, 823 655" class="water"/>
  <path d="M 705 385 C 755 460, 795 555, 823 655" class="water-soft"/>
  <path d="M 330 493 C 485 520, 645 592, 823 655" class="water-soft"/>

  <line x1="90" y1="726" x2="850" y2="726" class="dim"/>
  <line x1="895" y1="155" x2="895" y2="675" class="dim"/>

  <text class="label">
    <tspan x="376" y="242">upper bench</tspan>
    <tspan x="374" y="358">foot platform</tspan>
    <tspan x="164" y="590">heater</tspan>
    <tspan x="704" y="486">bench</tspan>
    <tspan x="704" y="508">return</tspan>
    <tspan x="800" y="632">scupper</tspan>
  </text>

  <text class="soft-label">
    <tspan x="414" y="147">back wall</tspan>
    <tspan x="385" y="708">front / Mt. Tam view</tspan>
    <tspan x="515" y="748">about 8 ft</tspan>
    <tspan x="908" y="425">about 8 ft</tspan>
    <tspan x="472" y="698">centered door</tspan>
    <tspan x="240" y="703">window</tspan>
    <tspan x="670" y="703">window</tspan>
  </text>

  <circle cx="540" cy="640" r="16" class="number-circle"/>
  <circle cx="204" cy="536" r="16" class="number-circle"/>
  <circle cx="676" cy="520" r="16" class="number-circle"/>
  <circle cx="823" cy="655" r="16" class="number-circle"/>
  <text class="number">
    <tspan x="540" y="640">1</tspan>
    <tspan x="204" y="536">2</tspan>
    <tspan x="676" y="520">3</tspan>
    <tspan x="823" y="655">4</tspan>
  </text>

  <rect x="940" y="132" width="270" height="300" rx="10" class="callout"/>
  <text class="key">
    <tspan x="965" y="166" class="key-head">What changed</tspan>
    <tspan x="965" y="204">1. Front wall reads clean:</tspan>
    <tspan x="985" y="225">centered door, balanced glass.</tspan>
    <tspan x="965" y="264">2. Heater gets its own corner</tspan>
    <tspan x="985" y="285">and guard zone near entry.</tspan>
    <tspan x="965" y="324">3. L return needs foot support,</tspan>
    <tspan x="985" y="345">not just a high seat.</tspan>
    <tspan x="965" y="384">4. Slab slope ends at one</tspan>
    <tspan x="985" y="405">controlled front-right outlet.</tspan>
  </text>

  <rect x="940" y="470" width="270" height="225" rx="10" class="callout"/>
  <text x="965" y="504" class="key-head">Bench height logic</text>
  <line x1="982" y1="654" x2="1168" y2="654" class="section-line"/>
  <line x1="982" y1="528" x2="1168" y2="528" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="1002" y="555" width="142" height="20" rx="4" class="upper"/>
  <rect x="1024" y="600" width="120" height="18" rx="4" class="lower"/>
  <rect x="1055" y="635" width="89" height="14" rx="4" class="duck"/>
  <text class="small">
    <tspan x="966" y="532">96 in ceiling</tspan>
    <tspan x="1154" y="572">52 in upper</tspan>
    <tspan x="1154" y="616">36 in feet</tspan>
    <tspan x="1154" y="650">16-18 in step</tspan>
    <tspan x="966" y="682">Feet stay above a low heater top.</tspan>
  </text>
</svg>
