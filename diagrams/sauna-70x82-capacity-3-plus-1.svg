<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Compact sauna capacity: two excellent, three comfortable, fourth compromised</title>
  <desc id="desc">A simplified plan for a compact seventy inch by eighty two inch hot room. Two people sit comfortably on the long upper bench, a third sits turned ninety degrees on the short return, and a fourth can sit on the upper bench section without foot support.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .title { font-size: 29px; font-weight: 700; }
      .sub { font-size: 17px; fill: #475569; }
      .label { font-size: 17px; font-weight: 650; }
      .note { font-size: 14px; fill: #475569; }
      .room { fill: #fffaf3; stroke: #111827; stroke-width: 6; }
      .upper { fill: #f1c99a; stroke: #9a6a36; stroke-width: 2.5; }
      .foot { fill: #f8e4c8; stroke: #b7793d; stroke-width: 2.2; }
      .step { fill: #fcefdc; stroke: #b7793d; stroke-width: 2; }
      .clear { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 7; }
      .heater { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2.5; }
      .door { fill: #dbeafe; stroke: #2563eb; stroke-width: 3; }
      .excellent { fill: #dcfce7; stroke: #15803d; stroke-width: 2.5; }
      .third { fill: #ccfbf1; stroke: #0f766e; stroke-width: 2.5; }
      .fourth { fill: #fef9c3; stroke: #a16207; stroke-width: 2.5; stroke-dasharray: 8 6; }
      .dim { fill: none; stroke: #334155; stroke-width: 2.5; marker-start: url(#arrow); marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="1200" fill="#ffffff"/>
  <text x="78" y="72" class="title">Capacity read: 2 excellent, 3 reasonable, 4 compromised</text>
  <text x="78" y="104" class="sub">The third person uses the short return. The fourth sits high but loses proper foot support.</text>

  <g transform="translate(210 180) scale(8)">
    <rect x="0" y="0" width="70" height="82" rx="1" class="room"/>
    <rect x="12" y="0" width="58" height="24" rx="1" class="upper"/>
    <rect x="12" y="24" width="58" height="18" rx="1" class="foot"/>
    <rect x="0" y="24" width="12" height="34" rx="1" class="upper"/>
    <rect x="24" y="42" width="30" height="12" rx="1" class="step"/>
    <rect x="18" y="54" width="30" height="18" rx="1" class="clear"/>
    <rect x="42" y="54" width="28" height="28" rx="1" class="heater"/>
    <rect x="20" y="82" width="30" height="7" rx="1" class="door"/>
    <path d="M 20 82 Q 35 66 50 82" fill="none" stroke="#2563eb" stroke-width="0.35"/>

    <circle cx="28" cy="12" r="5.2" class="excellent"/>
    <circle cx="44" cy="12" r="5.2" class="excellent"/>
    <circle cx="6" cy="40" r="5.0" class="third"/>
    <circle cx="60" cy="12" r="4.8" class="fourth"/>
  </g>

  <line x1="210" y1="880" x2="770" y2="880" class="dim"/>
  <text x="445" y="916" class="label">70 in finished width</text>
  <line x1="820" y1="180" x2="820" y2="836" class="dim"/>
  <text x="842" y="520" class="label">82 in depth</text>

  <rect x="870" y="250" width="250" height="305" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="902" y="292" class="label">Better read</text>
  <text x="902" y="332" class="note">1 person: excellent</text>
  <text x="902" y="362" class="note">2 people: excellent</text>
  <text x="902" y="392" class="note">3 people: reasonable</text>
  <text x="902" y="422" class="note">4 people: compromised</text>
  <text x="902" y="478" class="note">The return gives the third</text>
  <text x="902" y="505" class="note">person a real posture, not</text>
  <text x="902" y="532" class="note">just leftover bench space.</text>

  <rect x="870" y="615" width="250" height="175" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <text x="902" y="657" class="label">Heater note</text>
  <text x="902" y="697" class="note">At this volume, HIVE Mini 9</text>
  <text x="902" y="727" class="note">looks more natural than 11,</text>
  <text x="902" y="757" class="note">unless glass/loss pushes it up.</text>
</svg>
