<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Side-yard sauna plan</title>
  <desc id="desc">Top-view concept for a smaller side-yard sauna on a ten foot by eight foot decomposed granite pad. The sauna has a glass door, one front heater, a full back upper bench, a foot platform, and a short right-side return for a fourth person.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .title { font-size: 28px; font-weight: 700; }
      .sub { font-size: 16px; fill: #475569; }
      .label { font-size: 17px; font-weight: 650; }
      .note { font-size: 14px; fill: #475569; }
      .small { font-size: 13px; fill: #475569; }
      .pad { fill: #f4f1e8; stroke: #8b7b58; stroke-width: 3; }
      .retainer { fill: none; stroke: #525252; stroke-width: 8; stroke-linecap: round; }
      .sauna { fill: #f8fafc; stroke: #111827; stroke-width: 7; }
      .wall-inner { fill: none; stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 7 7; }
      .bench { fill: #f1c99a; stroke: #9a6a36; stroke-width: 2.5; }
      .foot { fill: #f8e4c8; stroke: #b7793d; stroke-width: 2; }
      .heater { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2.5; }
      .door { fill: #dbeafe; stroke: #2563eb; stroke-width: 3; }
      .service { fill: #e2e8f0; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 7; }
      .pier { fill: #e5e7eb; stroke: #374151; stroke-width: 2; }
      .dim { fill: none; stroke: #334155; stroke-width: 2.5; marker-start: url(#arrow); marker-end: url(#arrow); }
      .flow { fill: none; stroke: #2563eb; stroke-width: 3.5; marker-end: url(#arrow-blue); }
    </style>
  </defs>

  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="70" y="54" class="title">Side-yard plan: smaller, simpler, more sauna-first</text>
  <text x="70" y="82" class="sub">Concept footprint on the 10 ft x 8 ft DG pad. Assumes the fence is behind the sauna and the approach is from the front.</text>

  <rect x="90" y="145" width="760" height="608" rx="8" class="pad"/>
  <path d="M 90 145 H 850 V 753 H 90 Z" class="retainer"/>
  <text x="360" y="130" class="label">10 ft DG pad</text>
  <text x="55" y="460" class="label" transform="rotate(-90 55 460)">8 ft deep</text>
  <text x="360" y="790" class="label">front / side-yard approach</text>
  <text x="375" y="170" class="small">fence behind</text>

  <rect x="900" y="195" width="180" height="430" rx="8" class="service"/>
  <text x="930" y="235" class="label">service strip</text>
  <text x="927" y="260" class="note">keep one side</text>
  <text x="927" y="280" class="note">inspectable</text>

  <rect x="180" y="210" width="560" height="532" rx="6" class="sauna"/>
  <rect x="210" y="240" width="500" height="472" rx="4" class="wall-inner"/>
  <text x="334" y="197" class="label">about 7 ft 4 in x 7 ft exterior</text>
  <text x="304" y="232" class="small">about 6 ft 6 in finished interior width</text>

  <circle cx="220" cy="245" r="15" class="pier"/>
  <circle cx="460" cy="245" r="15" class="pier"/>
  <circle cx="700" cy="245" r="15" class="pier"/>
  <circle cx="220" cy="495" r="15" class="pier"/>
  <circle cx="460" cy="495" r="15" class="pier"/>
  <circle cx="700" cy="495" r="15" class="pier"/>
  <circle cx="220" cy="705" r="15" class="pier"/>
  <circle cx="460" cy="705" r="15" class="pier"/>
  <circle cx="700" cy="705" r="15" class="pier"/>
  <text x="920" y="342" class="note">piers carry the framed</text>
  <text x="920" y="362" class="note">floor above the DG pad</text>

  <rect x="235" y="255" width="450" height="120" rx="5" class="bench"/>
  <text x="345" y="320" class="label">upper bench: two great seats</text>
  <text x="405" y="345" class="note">third person sits here if needed</text>

  <rect x="235" y="405" width="450" height="92" rx="5" class="foot"/>
  <text x="330" y="458" class="label">continuous foot platform</text>

  <rect x="565" y="515" width="120" height="125" rx="5" class="bench"/>
  <text x="590" y="570" class="label">short</text>
  <text x="585" y="594" class="label">return</text>
  <text x="584" y="618" class="note">fourth seat</text>

  <rect x="245" y="590" width="115" height="105" rx="18" class="heater"/>
  <text x="268" y="637" class="label">HUUM</text>
  <text x="270" y="660" class="note">front corner</text>
  <text x="232" y="712" class="small">near panel side if practical</text>

  <rect x="488" y="712" width="130" height="52" rx="5" class="door"/>
  <path d="M 488 712 Q 555 640 618 712" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <text x="495" y="694" class="label">glass sauna door</text>
  <text x="510" y="785" class="small">only real window</text>

  <path d="M 330 628 C 405 566, 512 546, 610 548" class="flow"/>
  <text x="380" y="600" class="note">clear entry path</text>

  <line x1="90" y1="108" x2="850" y2="108" class="dim"/>
  <text x="445" y="101" class="small">10 ft</text>
  <line x1="875" y1="145" x2="875" y2="753" class="dim"/>
  <text x="890" y="455" class="small">8 ft</text>
</svg>
